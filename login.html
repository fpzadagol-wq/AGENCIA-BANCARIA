<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11152d"><title>Acesso | Portal de Gestão</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 15%,#29345d,#10152d 55%,#090d1e);font-family:Inter,Arial,sans-serif;color:#202943}.shell{width:min(430px,100%);background:#fff;border:1px solid #ffffff35;border-radius:22px;padding:34px;box-shadow:0 25px 80px #05081770}.brand{display:flex;align-items:center;gap:12px;margin-bottom:30px}.mark{width:43px;height:43px;border-radius:13px;background:linear-gradient(145deg,#9b8bff,#6750dc);display:grid;place-items:center;color:white;font-weight:900;font-size:20px}.brand b{font-size:14px;letter-spacing:.8px}.brand small{display:block;color:#8791a6;font-size:10px;margin-top:4px}.eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#7059e8;font-weight:800}h1{font-size:27px;letter-spacing:-1px;margin:9px 0 8px;color:#202943}.desc{font-size:12px;line-height:1.6;color:#8791a6;margin:0 0 25px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:11px;font-weight:700;color:#536078}.field input{height:45px;border:1px solid #e4e8f0;border-radius:10px;padding:0 13px;font-size:13px;outline:none}.field input:focus{border-color:#8b7af0;box-shadow:0 0 0 3px #7059e81a}.submit{width:100%;height:46px;border:0;border-radius:10px;background:#7059e8;color:white;font-size:12px;font-weight:800;margin-top:12px}.submit:disabled{opacity:.6;cursor:wait}.msg{display:none;margin-top:15px;padding:11px;border-radius:9px;font-size:11px;line-height:1.5}.msg.show{display:block}.msg.error{background:#fff0f0;color:#a43e45}.msg.ok{background:#eaf7f0;color:#216c4b}.foot{margin-top:24px;border-top:1px solid #edf0f5;padding-top:16px;color:#a1a9b7;font-size:9px;text-align:center}.setup{display:none}.setup.show{display:block}.hidden{display:none!important}</style></head><body><main class="shell"><div class="brand"><div class="mark">P</div><div><b>PORTAL DE GESTÃO</b><small>AGÊNCIA BANCÁRIA · FLUXOPAY</small></div></div><div class="eyebrow">Acesso seguro</div><h1 id="title">Bem-vindo de volta.</h1><p class="desc" id="desc">Entre com seu login e senha para acessar os painéis.</p>
<form id="loginForm"><div class="field"><label for="username">Login</label><input id="username" autocomplete="username" required maxlength="40"></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div><button class="submit" id="submit">Entrar no portal</button></form>
<section class="setup" id="setup"><div class="field"><label for="bootstrapKey">Chave inicial de configuração</label><input id="bootstrapKey" type="password" autocomplete="off"></div><div class="field"><label for="adminPassword">Senha do administrador (mínimo 8 caracteres)</label><input id="adminPassword" type="password" autocomplete="new-password"></div><button class="submit" id="setupBtn" type="button">Criar administrador principal</button></section><div class="msg" id="msg" role="status"></div><div class="foot">Acesso individual · Permissões por perfil · Sessão protegida</div></main><script src="auth-config.js"></script><script>
const API=(window.AUTH_CONFIG?.API_BASE_URL||"").replace(/\/$/,"");const $=id=>document.getElementById(id);const msg=(t,kind="error")=>{$("msg").textContent=t;$("msg").className="msg show "+kind};async function call(path,options={}){if(!API||API.includes("SEU-WORKER"))throw Error("O serviço de autenticação ainda precisa ser configurado.");const r=await fetch(API+path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||"Não foi possível concluir.");return d}
(async()=>{try{const s=await call("/api/status");if(!s.initialized){$("setup").classList.add("show");$("title").textContent="Configuração inicial";$("desc").textContent="Crie a conta principal de administração para iniciar o acesso compartilhado.";$("loginForm").classList.add("hidden")}}catch(e){msg(e.message)}})();
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("submit").disabled=true;try{const d=await call("/api/login",{method:"POST",body:JSON.stringify({username:$("username").value,password:$("password").value})});sessionStorage.setItem("portal_token",d.token);sessionStorage.setItem("portal_user",JSON.stringify(d.user));location.href="index.html"}catch(e){msg(e.message)}finally{$("submit").disabled=false}});
$("setupBtn").addEventListener("click",async()=>{try{await call("/api/bootstrap",{method:"POST",headers:{"X-Bootstrap-Key":$("bootstrapKey").value},body:JSON.stringify({username:$("username").value,password:$("adminPassword").value})});msg("Administrador criado. Agora entre com seu login e senha.","ok");$("setup").classList.remove("show");$("loginForm").classList.remove("hidden");$("title").textContent="Bem-vindo de volta.";$("desc").textContent="Entre com seu login e senha para acessar os painéis."}catch(e){msg(e.message)}});
</script></body></html>
